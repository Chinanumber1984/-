components:
  securitySchemes:
    SnowyToken:
      type: apiKey
      in: header
      name: token
  schemas:
    SupplierSummary:
      type: object
      properties:
        id:
          type: string
        supplierCode:
          type: string
        name:
          type: string
        category:
          type: string
        tier:
          type: string
        status:
          type: string
          enum:
          - POTENTIAL
          - REVIEWING
          - QUALIFIED
          - FROZEN
          - ELIMINATED
        orgId:
          type: string
        rowVersion:
          type: integer
          format: int64
      description: No raw credit code, phone or bank account; authorized fields use
        separate response DTOs.
    Page:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SupplierSummary'
        current:
          type: integer
        size:
          type: integer
        total:
          type: integer
    SupplierDraft:
      type: object
      additionalProperties: false
      required:
      - name
      - category
      - creditCode
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 128
        category:
          type: string
          maxLength: 32
        creditCode:
          type: string
          minLength: 18
          maxLength: 18
          writeOnly: true
          x-sensitive: true
        bankAccount:
          type: string
          maxLength: 64
          writeOnly: true
          x-sensitive: true
        address:
          type: string
          maxLength: 255
      description: No client orgId/status/tier. Server derives trusted organization,
        initial tier and potential state.
    Certificate:
      type: object
      additionalProperties: false
      required:
      - certType
      - certNo
      - validFrom
      - validTo
      - fileId
      - rowVersion
      properties:
        certType:
          type: string
        certNo:
          type: string
          maxLength: 64
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        fileId:
          type: string
        rowVersion:
          type: integer
    TaskAction:
      type: object
      additionalProperties: false
      required:
      - action
      - comment
      - rowVersion
      properties:
        action:
          type: string
          enum:
          - APPROVE
          - REJECT
          - RETURN
          - TRANSFER
          - ADD_SIGN
        comment:
          type: string
          minLength: 1
          maxLength: 512
        rowVersion:
          type: integer
        targetUserId:
          type: string
      description: TRANSFER/ADD_SIGN require validated targetUserId. Server validates
        actor, organization, assignment and transition.
    Error:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        traceId:
          type: string
        data:
          type: object
          nullable: true
          properties:
            reason:
              type: string
              enum:
              - SCOPE_DENIED
              - INVALID_STATE
              - CERT_REQUIRED
              - VERSION_CONFLICT
              - DUPLICATE_IDENTITY
              - INVALID_REVIEWER
    SupplierPageResult:
      type: object
      required:
      - code
      - msg
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Page'
        traceId:
          type: string
          nullable: true
    SupplierResult:
      type: object
      required:
      - code
      - msg
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SupplierSummary'
        traceId:
          type: string
          nullable: true
    ContactInput:
      type: object
      additionalProperties: false
      required:
      - name
      - phone
      - roles
      properties:
        name:
          type: string
          maxLength: 32
        phone:
          type: string
          writeOnly: true
          x-sensitive: true
          maxLength: 32
        email:
          type: string
          format: email
          maxLength: 64
        roles: &id001
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - ADMIN
            - QUOTE
            - SHIP
            - QUALITY
            - FINANCE
    ContactRoleUpdate:
      type: object
      additionalProperties: false
      required:
      - roles
      - rowVersion
      properties:
        roles: *id001
        rowVersion:
          type: integer
      description: Last enabled ADMIN cannot be removed; enforce under transaction
        lock.
    LifecycleRequest:
      type: object
      additionalProperties: false
      required:
      - action
      - reason
      - rowVersion
      properties:
        action:
          type: string
          enum:
          - FREEZE
          - UNFREEZE
          - ELIMINATE
        reason:
          type: string
          minLength: 1
          maxLength: 512
        rowVersion:
          type: integer
      description: Creates an approval request, never directly updates supplier status.
