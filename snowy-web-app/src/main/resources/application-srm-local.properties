# Local development only; credentials are generated outside tracked files.
server.port=8080
spring.datasource.dynamic.datasource.master.url=jdbc:mysql://127.0.0.1:13306/snowy?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true&useInformationSchema=true
spring.datasource.dynamic.datasource.master.username=root
spring.datasource.dynamic.datasource.master.password=${SRM_DB_PASSWORD}
spring.data.redis.port=16379
spring.datasource.dynamic.druid.initial-size=2
spring.datasource.dynamic.druid.min-idle=2
spring.datasource.dynamic.druid.max-active=10
flowable.database-schema-update=true
flowable.async-executor-activate=false
flowable.check-process-definitions=false
