name: SRM real workspace and lifecycle
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: snowy-admin-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare tool directory
        run: |
          sudo mkdir -p /workspace/.tools
          sudo chown "$(id -u):$(id -g)" /workspace/.tools
      - uses: actions/cache@v4
        with:
          path: |
            /workspace/.tools/m2
            /workspace/.tools/minio
          key: srm-java17-minio-16f8cf1-${{ hashFiles('**/pom.xml') }}
          restore-keys: srm-java17-minio-16f8cf1-
      - name: Install, test and build
        run: ./scripts/install.sh
      - name: Start actual services
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/init-local.sh
          nohup ./scripts/start-backend.sh > .runtime/backend-ci.log 2>&1 &
          nohup ./scripts/start-workspace.sh > .runtime/workspace-ci.log 2>&1 &
          ready=0
          for attempt in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/auth/b/isLogin >/dev/null && curl -fsS http://127.0.0.1:5175/ >/dev/null; then ready=1; break; fi
            sleep 2
          done
          [[ "$ready" == 1 ]] || { echo 'Services did not become ready; private logs retained locally'; exit 1; }
      - name: Real API and browser acceptance
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
          rm -f docs/workspace/*verification.json docs/lifecycle/*verification.json
          node scripts/test-workspace-api.mjs
          python scripts/test-workspace-browser.py
          node scripts/test-lifecycle-api.mjs
          python scripts/test-lifecycle-browser.py
          ./scripts/test-foundation-db.sh
      - name: Clean owned fixture only
        if: always()
        run: node scripts/cleanup-workspace-fixture.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: srm-workspace-lifecycle-acceptance
          path: |
            docs/workspace/*verification.json
            docs/lifecycle/*verification.json
            workspace/*.png
            snowy-plugin/*/target/surefire-reports/*.xml
